# Render 部署蓝图（免费版）
# 用法：在 Render 控制台 "New +" → "Blueprint" → 连接本仓库，Render 会按此文件创建服务。
services:
  - type: web
    name: half-marathon-coach
    runtime: docker
    plan: free               # 免费：15 分钟无请求会休眠，唤醒约 30s 冷启动
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # 注意：PORT 由 Render 自动注入，server/index.js 已读取 process.env.PORT，无需手动设置
